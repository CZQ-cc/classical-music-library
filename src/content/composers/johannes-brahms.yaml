name: 约翰内斯·勃拉姆斯
name_en: Johannes Brahms
period: romantic
birth: "1833"
death: "1897"
monogram: 勃
intro: |
  德国作曲家,「三 B 」之一(Bach/Beethoven/Brahms)。他背负着贝多芬的遗产
  苦熬二十一年才写下第一部交响曲,此后四部交响曲部部是德奥传统的高峰。
  汉斯利克称他为「反瓦格纳阵营的大将」,他与克拉拉·舒曼的深厚情谊
  与自我焚烧式的严谨(烧毁自己不满意的作品)共同构成他的传奇。
  拒绝过汉堡爱乐指挥一职?不——他拒绝的是多种荣誉,唯独作品从不妥协。
