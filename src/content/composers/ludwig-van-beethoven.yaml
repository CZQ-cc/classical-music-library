name: 路德维希·凡·贝多芬
name_en: Ludwig van Beethoven
period: classical
birth: "1770"
death: "1827"
monogram: 贝
portrait: /portraits/ludwig-van-beethoven.jpg
portrait_credit: "肖像:施蒂勒,1820(Wikimedia Commons,公有领域)"
intro: |
  德国作曲家,古典主义的高峰与浪漫主义的源头。自 1798 年起听力逐渐衰退,却在此后写出了最伟大的作品——
  「通过苦难,走向欢乐」是他给后人的精神遗嘱。九部交响曲、三十二首钢琴奏鸣曲、十六首弦乐四重奏构成了
  器乐音乐的三大支柱;《第五交响曲「命运」》《第九交响曲「合唱」》《月光奏鸣曲》早已越出音乐圈,
  成为现代文化通用语。他的录音版本之多、演绎争论之烈,在全部古典曲目中首屈一指。
