intro: |
  奥地利作曲家,音乐史上最罕见的天然之才。三十五年的生命留下六百多部作品,歌剧、交响曲、协奏曲、室内乐无不精通。
  他的音乐表面明朗优雅,内里藏着阴影与洞察——尤其是 g 小调作品(第四十交响曲、第二十五钢琴协奏曲)。
  1788 年夏,他在六周内连续完成第三十九、四十、四十一三部交响曲,堪称音乐史上的奇迹。
