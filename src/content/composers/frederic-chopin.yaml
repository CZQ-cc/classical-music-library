intro: |
  波兰作曲家、钢琴家,「钢琴诗人」。一生几乎只为钢琴写作,却把这件乐器的表达能力拓展到此前无人企及的深度:
  夜曲的如歌线条、叙事曲的史诗气魄、练习曲的技术革命、玛祖卡与波罗乃兹中的乡愁。
  1831 年流亡巴黎后再未回到故土,作品中始终回响着对波兰的思念。他的作品篇幅精悍,却是唱片史上版本竞争最激烈的领域之一。
