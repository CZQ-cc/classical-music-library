name: 彼得·伊里奇·柴可夫斯基
name_en: Pyotr Ilyich Tchaikovsky
period: romantic
birth: "1840"
death: "1893"
monogram: 柴
intro: |
  俄罗斯作曲家,旋律天赋在十九世纪无人能及。他的音乐在俄罗斯本土曾因「过于西化」受批评,在西方却因「过于煽情」受质疑——
  但正是这种直抒胸臆的真挚让他成为最受欢迎的作曲家之一。后三部交响曲(第四、第五、第六「悲怆」)构成一部隐秘的自传:
  从与命运的搏斗,到怀疑与挣扎,直至 1893 年首演九天后猝然离世前写下的告别。《悲怆》末乐章以慢板终结全曲,交响曲史上前所未有。
