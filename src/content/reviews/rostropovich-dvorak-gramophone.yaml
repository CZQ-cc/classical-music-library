quote: "Rostropovich's DG coupling with Karajan of the Dvořák Concerto and Tchaikovsky's Rococo Variations has dominated the catalogue for nearly two decades."
summary_zh: |
  《留声机》回顾德沃夏克大提琴协奏曲录音版图时指出:罗斯特罗波维奇与卡拉扬的这版 DG 耦合录音
  「统治目录近二十年」,并形容两人的合作是「两位伟大音乐家以完全的默契彼此应和」——
  这是该作品唱片史上分量极重的一句定评。
