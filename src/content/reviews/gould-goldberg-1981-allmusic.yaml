album: bach-goldberg-gould-1981
media: AllMusic
title: J.S. Bach Goldberg Variations by Glenn Gould(1981 版乐评)
url: "https://www.allmusic.com/album/bach-the-goldberg-variations-1981-recording--mw0001852244"
quote: "Gould's playing is incredible, sometimes taken at breathless speed, and yet still contains playing of remarkable depth and virtuosity."
summary_zh: |
  AllMusic 的评论认为 1981 年版古尔德的演奏「不可思议,有时以屏息般的速度推进,
  却依然保有惊人的深度与技巧」,并指出大量乐迷将这一版与 1955 年版等量齐观——
  两版并置聆听已成为《哥德堡》欣赏的经典姿势。
