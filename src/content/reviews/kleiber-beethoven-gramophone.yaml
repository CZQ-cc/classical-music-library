album: beethoven-5-kleiber
media: Gramophone(留声机)
title: "Beethoven: Symphonies Nos 5 & 7 乐评页"
url: https://www.gramophone.co.uk/reviews/beethoven-symphonies-nos-5-and-7
quote: "Great recordings of the Seventh, greatly played and greatly conducted … are as rare as gold-dust."
summary_zh: |
  《留声机》的评论文本长期将克莱伯这版第五、第七视为同类曲目的参照录音,
  尤其称赞第七交响曲中乐队声部(第一、第二小提琴分置左右)的清晰层次,
  并以「如金尘般稀有」形容这一水准的伟大录音。
