title: "Dietrich Fischer-Dieskau and Schubert's Winterreise 专题"
url: "https://www.gramophone.co.uk/content/features/dietrich-fischer-dieskau-and-schuberts-winterreise"
summary_zh: |
  《留声机》在菲舍尔-迪斯考专题(2012)中指出:《冬之旅》在他的曲目中
  「是最杰作的一部,无疑是流传最久、诠释空间最大的声乐套曲」;
  另一篇「冬季旅程」系列文章形容他的声音「比男中音更深……新鲜、灵活、
  跃跃欲试,时而冲动,甚至爆发」——正是 1972 年版的状态。
