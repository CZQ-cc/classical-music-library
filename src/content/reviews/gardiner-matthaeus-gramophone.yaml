summary_zh: |
  《留声机》评论称加德纳的处理「炽热而具有鲜活的戏剧感」:他没有刻意复原
  巴赫时代的演出条件,而是以古乐器的透明质感把受难故事拍成了电影。
  这一版被广泛视为本真乐器演出的龙头版本。
