summary_zh: |
  《留声机》在「贝多芬第九交响曲:最伟大的录音」专题(2024 年更新)中
  收录卡拉扬 1963 年版,强调其植根德奥传统的速度理想与暗流般的强度——
  在卡拉扬为 DG 录制的四套贝九中,1963 年版被普遍视为最均衡的一套。
