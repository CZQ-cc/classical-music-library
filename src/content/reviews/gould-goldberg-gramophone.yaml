title: "Bach: Goldberg Variations 乐评页"
url: https://www.gramophone.co.uk/reviews/bach-goldberg-variations-26
quote: "The recording is superb and how remarkable that what are arguably Gould's two greatest records should be his first and his last."
summary_zh: |
  《留声机》在古尔德版《哥德堡变奏曲》的评论中赞叹:录音本身出色,
  而更令人感慨的是——古尔德最伟大的两张唱片,恰好是他生涯的第一张(1955)与最后一张(1981)。
