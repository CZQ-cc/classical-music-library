title: "Mozart: Requiem 乐评页"
url: "https://www.gramophone.co.uk/reviews/mozart-requiem-22"
quote: "…luminous choral sound and weighty orchestral sound."
summary_zh: |
  《留声机》评价伯姆 1971 年版安魂曲「合唱音色如光,乐队音响如山岳」,
  CD 化后「呈现出令人印象深刻的真实感」。这一版以礼仪的庄严而非歌剧的煽情著称,
  近年 DG 又以「Original Source」黑胶系列将其再度推向发烧视野。
