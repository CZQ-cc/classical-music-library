rating: 9.2
essence: 「钢与天鹅绒」×大教堂式乐队——皇帝协奏曲的首选名单常客。
featured: true
tags: [协奏曲, 德奥传统, 钢琴作品]
background: |
  1971 年,吉列尔斯与卡拉扬、柏林爱乐录制贝多芬「皇帝」协奏曲(与第 4 首同辑)——
  苏联双峰之一与欧洲乐队之王的相遇,是 DG 黄金年代的大事件。
  乐评与乐迷长期把它列在该曲首选版本名单:「钢与天鹅绒」的音色
  与大教堂式乐队的威严互相成全。
editorial: |
  「皇帝」的三个记忆点:开场钢琴打断乐队的华彩(独奏家第一次「抢话」)、
  慢乐章拨弦上的默祷、以及那个著名的不间断转调——柔乐章结束前,
  一个小七度直接滑进终曲的猎歌,无需停顿。吉列尔斯把「威严」二字
  做到了每个和弦上;听它之前不妨先想一个问题:为什么这首曲子
  写于被拿破仑炮轰的维也纳,却没有一丝恐惧?
