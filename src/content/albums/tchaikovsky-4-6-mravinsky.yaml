essence: 钢铁与眼泪:后三部柴可夫斯基交响曲的苏联式标杆。
featured: true
tags: [交响曲, 俄派传统, 传奇名盘]
background: |
  1960 年秋,穆拉文斯基率列宁格勒爱乐在西方巡演期间为 DG 录下柴可夫斯基后三部交响曲,
  次年发行后轰动西方乐坛:精确如刀削的合奏、钢铁般的弦乐、近乎残忍的强度,
  颠覆了西方对柴可夫斯基「感伤沙龙」的印象。它至今仍是这套曲目的参照系之一,
  也是「俄派指挥美学」留给录音史最锋利的标本。
editorial: |
  这不是放松背景乐——请预留完整的一小时。「悲怆」第三乐章进行曲快得像冲锋,
  几乎必然骗走你的掌声;真正的结局是随后的慢板:穆拉文斯基不许乐队哭出声,
  压抑的呜咽比嚎啕更刺骨。第四、第五也各有名场面:第四的命运动机由圆号宣判,
  第五的圆号独白在别的录音里很少这样庄重。第一次听可能会觉得「冷酷」,听到第三遍会上瘾。
