rating: 9.2
essence: 「钢琴诗人」的名片,由最懂他的老人娓娓道来。
featured: true
tags: [钢琴作品, 浪漫主义]
background: |
  鲁宾斯坦 1965–67 年为 RCA 录制的肖邦夜曲全集,是这位肖邦权威晚年的圆熟之作。
  他弹了一辈子肖邦,深知夜曲的秘密不在甜,而在呼吸:装饰音如何像美声歌唱的花腔,
  左手的波浪如何既铺开夜色又不淹没旋律。全套二十一首,从少年 Op. 9 的明亮到晚期 Op. 62 的内省,
  像一部无词的自传。
editorial: |
  最舒服的打开方式:从 Op. 9 No. 2 开始——它大概是古典钢琴文献中被传唱最多的旋律。
  注意鲁宾斯坦第一次奏出主题时几乎「不做表情」,把全部的装饰留给后面每一次归来,这是老派的克制。
  然后直接跳到 Op. 48 No. 1(c 小调):同一张唱片里的另一个肖邦,圣咏般的肃穆与双八度的惊醒,
  会纠正「夜曲=背景音乐」的误解。夜里听,音量不必大。
