title: "舒伯特:冬之旅"
title_en: "Schubert: Winterreise"
label: Deutsche Grammophon
release_year: 1972
recordings:
  - schubert-winterreise-fds-1972
rating: 9.5
essence: 艺术歌曲录音史的标杆——《冬之旅》诠释的教科书。
featured: true
tags: [艺术歌曲, 传奇名盘, 德奥传统]
background: |
  1971–72 年,菲舍尔-迪斯考与钢琴大师杰拉尔德·摩尔二度录制《冬之旅》——
  他一生录过三次(1955/1972/1980),这一版以「强度与戏剧的自发性」著称,
  被《留声机》专题与 BBC Music Magazine 一致推为基准录音:
  菲舍尔-迪斯考的声音「比男中音更深……新鲜、灵活、跃跃欲试,时而冲动,甚至爆发」。
editorial: |
  《冬之旅》的正确听法:留出 70 分钟,只留自己。它是一整场「内心戏」——
  从「晚安」的雪夜离开,到「菩提树」的温柔呼唤,到「春梦」醒来的碎裂,
  最后跟着「老艺人」走向地平线。菲舍尔-迪斯考的每个德文字都被唱成戏;
  第一次听不必逐首理解,只要在「菩提树」处停留,你会发现旋律早就在你记忆里。
  艺术歌曲的成人礼,由此开始。
