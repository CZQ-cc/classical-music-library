title: "肖邦:练习曲全集(Op. 10 & Op. 25)"
title_en: "Chopin: The Études"
label: Deutsche Grammophon
release_year: 1972
recordings:
  - chopin-etudes-pollini-1972
rating: 9.3
essence: 录音史上的技术奇观——「练习曲」二字的天花板。
featured: true
tags: [钢琴作品, 技术奇观, 浪漫主义]
background: |
  1972 年,波利尼为 DG 录制肖邦全部二十四首练习曲——十八岁肖邦比赛冠军
  的三十年后,他把这套「钢琴家的圣经」变成了录音史上的技术奇观:
  左右手像两台独立乐器,「冬风」的音群每一粒都清可数,而旋风从不减速。
editorial: |
  练习曲的正确听法:别按顺序听全碟,先听三首「名曲」——Op. 10 No. 3「离别」
  (肖邦自称一生最美的旋律)、No. 12「革命」(华沙陷落之日的悲愤)、
  Op. 25 No. 11「冬风」(舒曼形容右手是「风暴中的旋风」)。
  然后你会发现波利尼版本的真正价值:在炫技的极限处,他让每一首
  都仍然是「诗」——这才是这套录音进入传奇的原因。
