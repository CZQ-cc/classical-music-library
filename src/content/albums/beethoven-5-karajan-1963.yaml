title: 贝多芬:第五&第六交响曲
title_en: "Beethoven: Symphonies Nos. 5 & 6"
label: Deutsche Grammophon
release_year: 1963
recordings:
  - beethoven-sym-5-karajan-1963
  - beethoven-sym-6-karajan-1963
rating: 9.0
essence: 立体声时代「德奥之声」的原点,听厚重贝多芬的默认选项。
tags: [交响曲, 德奥传统, 全集名版]
background: |
  1963 年,卡拉扬与柏林爱乐推出史上第一套全立体声贝多芬交响曲全集,一夜之间定义了此后二十年的
  贝多芬音响标准:弦乐如天鹅绒浪潮,铜管与定音鼓构成宏大的建筑立面。第五(与田园同册)是全集的销量支柱,
  它未必是最「深刻」的贝多芬,却是最华丽、最匀速、最容易让人爱上交响乐声音本身的版本。
editorial: |
  如果说克莱伯的贝五是闪电,卡拉扬的贝五就是大理石宫殿。把两个版本连着听是最经典的家庭作业:
  同样的音符,一个在奔跑,一个在筑墙。注意第二乐章:卡拉扬的弦乐歌唱是这个录音最无可替代的部分——
  「命运」在此收起獠牙,变成一次庄严的合唱。对音响发烧友,这张 1963 年的录音也是检验器材弦乐质感的试金石。
