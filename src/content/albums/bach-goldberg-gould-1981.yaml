title: 巴赫:哥德堡变奏曲(1981)
title_en: "Bach: Goldberg Variations (1981)"
label: CBS Masterworks
release_year: 1982
recordings:
  - bach-goldberg-gould-1981
rating: 9.5
essence: 二十六年后的重逢与告别——一个人与一部作品互相完成。
featured: true
tags: [键盘作品, 巴洛克, 传奇名盘]
background: |
  1981 年 4 月至 5 月,古尔德回到同一间录音室,重新录制他成名的作品:速度大幅放慢,
  保留全部重复段,声部如石刻般层层凿出。录音发行次年,他因中风猝然离世,年五十岁。
  这张唱片因此成为一份无意间写就的遗言——从 1955 年的宣言到 1981 年的沉思,
  两次《哥德堡》之间,是二十世纪钢琴演奏史最著名的一对括号。
editorial: |
  请完整地听完它(约 51 分钟,不含删节)。咏叹调第一次响起时,请记住它;当它在三十段变奏与一首
  集腋曲的玩笑之后原样归来时,你会明白为什么有人说「听过返始的咏叹调,才算是听过《哥德堡》」。
  第 25 变奏「黑色深渊」是全曲的受难曲,古尔德在这里慢得近乎静止。若深夜独听,建议提前准备好安静——
  这张唱片值得一次不打扰的聆听。
