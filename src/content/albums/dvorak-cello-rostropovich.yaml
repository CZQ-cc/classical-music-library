title: 德沃夏克:b小调大提琴协奏曲(含洛可可变奏曲)
title_en: "Dvořák: Cello Concerto & Tchaikovsky: Rococo Variations"
cover: /covers/dvorak-cello-rostropovich.jpg
label: Deutsche Grammophon
release_year: 1969
recordings:
  - dvorak-cello-rostropovich-1969
rating: 9.4
essence: 两位巨人的一次完全默契的对话,《留声机》认证的目录统治者。
featured: true
tags: [协奏曲, 传奇名盘]
background: |
  1968–69 年,罗斯特罗波维奇与卡拉扬、柏林爱乐录制德沃夏克 b 小调大提琴协奏曲与
  柴可夫斯基《洛可可变奏曲》。罗斯特罗波维奇的琴声像从胸腔里唱出来,卡拉扬则以罕见的克制
  为独奏铺开画布。《留声机》评价这版 DG 耦合录音「统治目录近二十年」,
  并称两位音乐家「以完全的默契彼此应和」。它是大提琴协奏曲唱片史上绕不开的坐标。
editorial: |
  第一乐章开头请留意:独奏进入时那句话般的宽阔歌唱——大提琴在这里不是独奏家,
  是一位歌剧主角。第二乐章是全曲的心脏,静到需要你调大音量;第三乐章尾声,
  大提琴与小提琴首席的二重奏是一场温柔的告别(德沃夏克写给亡故的小姨子),
  请听到最后一个音消失再摘下耳机。《洛可可变奏曲》是柴可夫斯基向古典时代的致意,轻巧幽默,正好收尾。
