title: "舒伯特:第八「未完成」 & 第五"
title_en: "Schubert: Symphonies Nos. 5 & 8"
label: Deutsche Grammophon
release_year: 1978
recordings:
  - schubert-unfinished-kleiber-1978
rating: 9.4
essence: 克莱伯一生只录两部交响曲的另一半——「未完成」由此完成了。
featured: true
tags: [交响曲, 德奥传统, 传奇名盘]
background: |
  继 1975 年的勃拉姆斯第四(以及贝多芬五七)之后,克莱伯 1978 年再次
  与维也纳爱乐进入录音室,只录了舒伯特:第五交响曲(B 大调,明亮的青春)
  与第八「未完成」(b 小调,雾中的歌唱)。这一张唱片此后与贝五七并列,
  构成克莱伯全部交响曲录音遗产——少,但每一张都是极短名单上的常客。
editorial: |
  「未完成」的正确听法:先接受它只有两个乐章,然后你会发现它比任何
  「完成」的交响曲都完整——克莱伯让圆号在雾里走得极慢,又让大提琴的
  歌唱亮得发烫。把第五交响曲放在「未完成」之前听:那是同一位作曲家
  十九岁时的春天,相隔五年,同一支笔。两相对照,你会听见「成长」本身。
