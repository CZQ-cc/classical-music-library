title: "勃拉姆斯:e小调第四交响曲"
title_en: "Brahms: Symphony No. 4"
label: Deutsche Grammophon
release_year: 1980
recordings:
  - brahms-sym-4-kleiber-1980
rating: 9.6
essence: 克莱伯又一「极短名单」传奇——三十个变奏的终曲挽歌。
featured: true
tags: [交响曲, 德奥传统, 传奇名盘]
background: |
  1980 年,克莱伯与维也纳爱乐录制勃拉姆斯第四交响曲——他一生极少的
  录音室交响曲之一。乐评界普遍将此版列入「最伟大勃拉姆斯第四」的
  极短名单:第一乐章的呼吸错觉、终曲帕萨卡利亚三十个变奏的轮廓
  清楚可见而旋风从不减速。维也纳爱乐的状态如 1975 年贝多芬七一般燃烧。
editorial: |
  勃拉姆斯第四是四部交响曲中最「内向」的一部:它不与命运搏斗,
  它在告别。听的时候请把注意力放在终曲——固定低音上的三十个变奏,
  是勃拉姆斯向巴赫借来的古老技法,铸成浪漫主义时代最大的挽歌。
  克莱伯的速度比谁都快,但那个「挽歌的轮廓」从第一变奏到第三十个
  一直悬在那里。结尾没有胜利,没有安慰——「不可能再有」的沉默,
  是这部交响曲真正的最后一个音符。
