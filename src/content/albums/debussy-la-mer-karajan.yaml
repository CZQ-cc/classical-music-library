title: "德彪西:牧神午后 & 海"
title_en: "Debussy: Prélude à l'après-midi d'un faune & La mer"
label: Deutsche Grammophon
release_year: 1985
recordings:
  - debussy-la-mer-karajan-1985
rating: 8.7
essence: 法音德奏——用柏林爱乐的厚度画印象派的光与水。
tags: [印象主义, 管弦乐]
notes: 「法音德奏」的奇特标本,争议与魅力并存。
background: |
  1985 年,卡拉扬与柏林爱乐录制德彪西《牧神午后》与《海》——
  「法音德奏」的奇特标本:用柏林爱乐的厚重光泽画印象派的光与水。
  评论界对这种组合争议多年,但听感上它独一无二:
  《海》的浪墙被拍出了纪念碑式的规模。
editorial: |
  听法建议:从《牧神午后》开始(1894 年的那支长笛常被称为现代音乐的开端),
  然后进入《海》三幅。第二幅「浪之嬉戏」是管弦乐最顽皮的乐章,
  第三幅结尾的浪墙则最壮丽——卡拉扬把规模感推到极限,
  这是「法音德奏」争议的另一面:他让德彪西变成了德尔斐的阿波罗神庙。

