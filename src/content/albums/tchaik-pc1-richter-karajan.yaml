title: "柴可夫斯基:第一钢琴协奏曲"
title_en: "Tchaikovsky: Piano Concerto No. 1"
label: Deutsche Grammophon
release_year: 1962
recordings:
  - tchaik-pc1-richter-karajan-1962
rating: 8.9
essence: 双巨人唯一一次录音室合作——最大的开幕词遇上最锋利的刀刃。
tags: [协奏曲, 俄式浪漫, 双巨人]
background: |
  1962 年,里赫特与卡拉扬、柏林爱乐录制柴可夫斯基第一钢琴协奏曲——
  两大巨人唯一一次录音室合作。DG 的录音把开场巨浪的规模感
  拍到了极限,里赫特的钢铁触键与卡拉扬的乐队互不相让。
editorial: |
  这张唱片的意义不在「哪一版最好」,而在「两大强者的诚实对话」:
  里赫特的每一句都像刀刃,卡拉扬用乐队规模回应。
  听之前先想清楚:这首曲子的开场 106 小节是古典音乐最大的开幕词,
  「正片」开始后才是真正的较量。喜欢火爆钢琴的听众,这是必收的一张。

