title: "拉赫玛尼诺夫:第二钢琴协奏曲"
title_en: "Rachmaninoff: Piano Concerto No. 2"
label: Deutsche Grammophon
release_year: 1959
recordings:
  - rach-pc2-richter-1959
rating: 8.9
essence: 里赫特在华沙的现场——最受欢迎的协奏曲遇上最不怕它的手。
tags: [协奏曲, 俄式浪漫, 现场录音]
notes: 现场录音,有少量听众杂音;里赫特本人对此版钟爱有加。
background: |
  1959 年,里赫特在华沙与维斯洛茨基、华沙国家爱乐录制拉赫玛尼诺夫《第二钢琴协奏曲》
  ——现场录音,有少量听众杂音。里赫特本人对此版钟爱有加:
  他的第一乐章渐强像山体滑坡,第二乐章又轻得像雪。这部「最受欢迎的协奏曲」
  在这个版本里第一次露出了它的全部锋利。
editorial: |
  这张唱片的正确听法:接受现场感,然后把注意力放在「对比」上——
  里赫特的第一乐章是所有版本中最不「抒情」却最有力量的:钢铁触键的渐强一浪高过一浪;
  第二乐章他却弹出了录音史上最轻的拉赫。深夜听,音量中等,
  你会听见「最受欢迎」背后的锋利。

