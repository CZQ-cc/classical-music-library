title: 巴赫:哥德堡变奏曲(1955)
title_en: "Bach: Goldberg Variations (1955)"
cover: /covers/bach-goldberg-gould-1955.jpg
label: Columbia
release_year: 1956
recordings:
  - bach-goldberg-gould-1955
rating: 9.0
essence: 二十二岁的天才宣言,一张唱片改变一部作品的命运。
tags: [键盘作品, 巴洛克, 传奇名盘]
background: |
  1955 年 6 月,哥伦比亚唱片公司冒险让一位无名加拿大青年录制一部当时还算冷门的键盘作品。
  古尔德删去大部分重复段,以惊人的速度与刀刻般的清晰度完成了录音——次年发行后成为畅销片,
  《哥德堡变奏曲》从此从琴房走进千家万户。《留声机》后来感叹:「古尔德最伟大的两张唱片,
  恰好是他的第一张与最后一张。」
editorial: |
  先听 1981、再听 1955,你会听见「年轻」本身:同一双手,同样的哼唱,却像另一个人。
  1955 年版的第 25 变奏只有几分钟(1981 年几乎长一倍),快得像少年跳过深渊。
  如果你只想轻松地欣赏巴赫的机智与活力,这张是更好的入口;想要沉思与告别的重量,请移步 1981。
  两张都收,是乐迷的成人礼。
