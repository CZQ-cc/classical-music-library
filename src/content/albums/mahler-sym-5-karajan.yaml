title: "马勒:第五交响曲"
title_en: "Mahler: Symphony No. 5"
label: Deutsche Grammophon
release_year: 1973
recordings:
  - mahler-sym-5-karajan-1973
rating: 8.8
essence: 送葬进行曲与小柔板——卡拉扬弦乐的马勒初探。
tags: [交响曲, 晚期浪漫]
background: |
  1973 年,卡拉扬首次为 DG 录制马勒第五——他早年以莫扎特/贝多芬著称,
  马勒的加入是七十年代的重大转向。这一版以「无与伦比的弦乐」著称:
  送葬进行曲的沉痛与小柔板的温柔同样极致,
  是进入马勒世界最稳妥的入口之一。
editorial: |
  马勒第五是一部「无词传记」:送葬进行曲、暴风雨、粗野谐谑、
  写给阿尔玛的小柔板、最后的大团圆——五个乐章从黑暗走到光明。
  卡拉扬版的听点:弦乐在送葬进行曲里像移动的黑色纪念碑,
  小柔板则是「死亡与美」这一文化符号的源头(《魂断威尼斯》)。
  第一次听马勒,从这部开始最合适。

