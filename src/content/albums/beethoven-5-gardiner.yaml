title: 贝多芬:第五&第七交响曲(古乐版)
title_en: "Beethoven: Symphonies Nos. 5 & 7"
label: Archiv Produktion
release_year: 1994
recordings:
  - beethoven-sym-5-gardiner-1994
  - beethoven-sym-7-gardiner-1994
rating: 8.6
essence: 用贝多芬时代的乐器,听见另一副面孔的「命运」。
tags: [交响曲, 古乐演奏, 版本对照]
background: |
  九十年代「本真演奏」浪潮的代表作:加德纳率革命与浪漫乐团用古乐器录制的贝多芬交响曲全集,
  第五、第七同册。自然圆号敞亮逼人,羊肠弦的弦乐组轻得几乎没有重量,整体速度显著快于传统大乐团版本。
  它与卡拉扬 1963 年版恰好处在贝多芬演绎光谱的两端,是「版本比较」最生动的教材。
editorial: |
  听这张之前请先放下「音色越厚越好」的预设:古乐器的美在于对比与透明——强奏像金属撞击,
  弱奏像室内乐。第一乐章发展部的对位线条在这里清晰得可以直接跟着数声部。它不适合作为唯一的一张贝五,
  但作为第二张,它将彻底改变你对这部作品「长什么样」的想象。建议听完克莱伯再听它,落差本身就是收获。
