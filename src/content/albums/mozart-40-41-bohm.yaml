title: 莫扎特:第四十&第四十一交响曲「朱庇特」
title_en: "Mozart: Symphonies Nos. 40 & 41 \"Jupiter\""
label: Deutsche Grammophon
release_year: 1976
recordings:
  - mozart-sym-40-bohm-1974
  - mozart-sym-41-bohm-1974
rating: 9.0
essence: 一暗一明的莫扎特双联画,德奥指挥传统的教科书演绎。
tags: [交响曲, 德奥传统]
background: |
  伯姆与维也纳爱乐 1974 年录制的莫扎特晚期交响曲。伯姆一生录过多次莫扎特交响曲,
  这份晚期录音以从容的速度、温暖的弦乐与毫无做作的句法成为长期参考版本:
  g 小调第四十的焦虑被安放在古典的框架里,C 大调第四十一「朱庇特」的赋格终曲
  则像一场庄严的庆典。没有猎奇的速度,没有过度的表情,只有莫扎特本来的样子。
editorial: |
  把两部交响曲连着听:第四十开场的不安搏动与第四十一开场的号角宣告,是同一颗心的昼夜两面。
  「朱庇特」终曲请数一数主题:木管与弦乐各持有自己的旋律,最后四个主题同时叠入赋格——
  伯姆让每个声部都清楚可闻,这种「透明的丰满」正是维也纳传统的独门手艺。
  入门者若觉得莫扎特「太甜」,请从第四十第一乐章听起。
