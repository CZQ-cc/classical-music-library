title: "维瓦尔第:四季"
title_en: "Vivaldi: The Four Seasons"
label: Archiv Produktion
release_year: 1982
recordings:
  - vivaldi-four-seasons-pinnock-1982
rating: 8.8
essence: 《四季》最经典的古乐器版本之一,《Classic Review》Top 10 入选。
tags: [巴洛克, 古乐演奏, 入门首选]
notes: 平诺克与英国协奏团后期(1988 前后)另有重录版,同样出色。
background: |
  1982 年,平诺克与英国协奏团为 Archiv 录制《四季》(小提琴:西蒙·斯坦戴奇)——
  英国本真演奏运动的代表作之一。《Classic Review》将其列入《四季》最佳录音 Top 10,
  称其「历经岁月而依然出色」:明快、锋利、毫分不差。
editorial: |
  《四季》几乎人人听过片段,但完整的四首一起听是另一回事:
  《春》的鸟鸣、《夏》的暴风雨(巴洛克最狂野的页码)、
  《秋》的醉汉、《冬》的炉火与眺望——维瓦尔第在乐谱上逐句标注,
  是史上最早的「标题音乐」。第一次听完整版,建议从《夏》第三乐章开始,
  那场暴风雨会让你对巴洛克刮目相看。

