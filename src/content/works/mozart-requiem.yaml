title: d小调安魂曲
title_en: Requiem in D minor, K. 626
composer: wolfgang-amadeus-mozart
genre: 安魂弥撒
catalog_no: K. 626
composed_year: "1791(未完成)"
movements:
  - title: 进咏曲 · 垂怜经 · 继叙咏「震怒之日」 · 献祭经 · 圣哉经 · 降福经 · 羔羊经 · 永恒之光
    note: 「震怒之日」的末日号角与「落泪之日」的哀婉是全曲两极
background: |
  1791 年秋,一位匿名信使登门委托莫扎特写一部安魂弥撒(后查明是伯爵欲冒名之作)。
  重病中的莫扎特深信这是为自己写的。12 月 5 日他溘然长逝,作品止于第八小节;
  学生苏斯迈尔依据他留下的草稿与口述完成了续写。《阿玛迪斯》电影让「灰衣人委托」的传说
  家喻户晓——虽是戏剧化演绎,但这部安魂曲确实成了他写给自己的告别。
why_classic: |
  它以巴洛克式的对位骨架(亨德尔《弥赛亚》的「哈利路亚」主题被直接引用进「永恒之光」)
  承载最赤裸的死亡恐惧。「震怒之日」的雷霆、「号角响彻四方」的小号独奏、
  「落泪之日」中女声的哀婉——半部音乐史上最著名的「末日图景」出自这里,
  而它的未完成性让每个聆听者都在续写那封「写给自己的信」。
