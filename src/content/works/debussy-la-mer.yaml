title: 《牧神午后》与《海》
title_en: Prélude à l'après-midi d'un faune & La mer
composer: claude-debussy
genre: 交响素描
catalog_no: L. 86 / L. 109
composed_year: "1894 / 1905"
movements:
  - title: 牧神午后前奏曲(单乐章)
    note: 长笛的下行半音——常被称为现代音乐的开端
  - title: 海:三幅交响素描
    note: 「海上——从黎明到中午」「浪之嬉戏」「风与海的对话」
background: |
  《牧神午后》(1894)取材马拉美的象征主义诗篇,首演于巴黎;
  十年后《海》出版,乐谱封面上印着葛饰北斋的《神奈川冲浪里》——
  德彪西直言他心目中的海是「日本版画里的海」。两部作品相隔十年,
  分别是「印象主义」的开端与成熟。
why_classic: |
  德彪西做的事,简单说:让和声变成颜色。《牧神午后》的长笛
  在半音的世界里游动,没有主题的「发展」,只有光影的变化——
  布莱兹说它像「波德莱尔之后的诗歌传统换了一个媒介」。
  《海》则证明这种语言可以承载巨大的能量:第三乐章的浪墙
  是管弦乐史上最壮丽的「水的构图」。
