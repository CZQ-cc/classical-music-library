title: d小调第九交响曲「合唱」
title_en: Symphony No. 9 in D minor "Choral", Op. 125
composer: ludwig-van-beethoven
genre: 交响曲
catalog_no: Op. 125
composed_year: "1822–1824"
movements:
  - title: 不太快、略庄严的快板
    note: 开头的空白五度如宇宙初开,主题从碎片中凝聚
  - title: 谐谑曲:很快的
    note: 定音鼓独奏承担调性——交响曲史无前例
  - title: 如歌的柔板
    note: 双主题变奏,由木管轻声开启
  - title: 终曲:急板
    note: 席勒《欢乐颂》——人声第一次进入交响曲
background: |
  席勒《欢乐颂》的青年时代,贝多芬就曾想过为它谱曲;这个念头酝酿了三十年,
  终于在 1822–24 年间与「第九」的器乐构想合流。1824 年 5 月 7 日维也纳首演,
  全聋的作曲家背对观众站在指挥旁,演出结束仍盯着乐谱——女中音轻拉他的衣袖,
  他才转过身,看到全场起立的沸腾。这是他最后一次公开露面。
why_classic: |
  它改写了交响曲的定义:前三乐章把纯器乐推到极限(宇宙般的开篇、定音鼓独奏的谐谑、
  天籁般的慢乐章),然后贝多芬亲手打破规则——「哦,朋友们,不要这样的声音!
  让我们唱出更愉快、更欢乐的吧」——人声就此进入交响曲。「欢乐颂」的旋律
  简单得任何人都能哼,却在四个声部的变奏中走向人声的星空。
  1972 年起它是欧盟盟歌;当它响起,无论语言与出身,「拥抱吧,万民」是对全人类说的。
