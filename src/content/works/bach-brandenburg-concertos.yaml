title: 勃兰登堡协奏曲(六首)
title_en: Brandenburg Concertos Nos. 1–6, BWV 1046–1051
composer: johann-sebastian-bach
genre: 大协奏曲
catalog_no: BWV 1046–1051
composed_year: "1721"
movements:
  - title: 六首各 2–4 乐章,每首采用不同的乐器组合
    note: 第三首仅两个和弦「过渡」的第二乐章是音乐史最著名的未解之谜
background: |
  1721 年巴赫将六首协奏曲的手稿题献给勃兰登堡-施韦特侯爵克里斯蒂安·路德维希,
  「勃兰登堡」之名由此而来——而侯爵的手稿此后静静躺在图书馆里,从未被演出。
  每首采用不同的独奏组合(小提琴、圆号、长笛、小号……),是大协奏曲体裁的巅峰实验。
why_classic: |
  它是巴洛克乐器音色的调色板:六首曲子六种「乐队配置」,彼此互不重复。
  第二首高音小号与第四首小提琴的炫技至今是极限考验;第三首的对称结构与第六首的两台中提琴
  则展示了巴赫对音色配对的先知先觉。任何版本的唱片目录里,它都是巴洛克的第一入口。
