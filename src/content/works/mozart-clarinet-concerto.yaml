title: A大调单簧管协奏曲
title_en: Clarinet Concerto in A major, K. 622
composer: wolfgang-amadeus-mozart
genre: 协奏曲
catalog_no: K. 622
composed_year: "1791"
movements:
  - title: 快板
  - title: 柔板
    note: 单簧管文献中最著名的慢乐章,电影《走出非洲》使其家喻户晓
  - title: 回旋曲:快板
background: |
  1791 年 10 月完成,为单簧管演奏家安东·施塔德勒而作——莫扎特生前最后一批完整作品之一
  (与《魔笛》《安魂曲》同年)。原稿为 b 调单簧管而写(今多以 A 调单簧管演奏)。
  一个多月后作曲家去世,施塔德勒在布拉格为它举办义演,所得用于偿还莫扎特的债务与遗孀的抚恤。
why_classic: |
  莫扎特是第一位认真对待单簧管的伟大作曲家,这部协奏曲至今仍是单簧管的「圣经」。
  第一乐章的安详、柔乐章近乎透明的哀歌、末乐章的嬉游——它把这件乐器的歌唱极限
  与莫扎特晚年的从容融为一体,听不出一丝「绝笔」的阴影,只有光。
