title: 四季
title_en: The Four Seasons, RV 269 / 315 / 293 / 297
composer: antonio-vivaldi
genre: 小提琴协奏曲集
catalog_no: RV 269 / 315 / 293 / 297
composed_year: "1725"
movements:
  - title: 春 · 夏 · 秋 · 冬(每首三乐章:快-慢-快)
    note: 每首前附十四行诗,音乐逐句「标注」——最早的标题音乐杰作
background: |
  1725 年作为《和声与创意的试验》集的前四曲出版于阿姆斯特丹。
  维瓦尔第在每首协奏曲前附上十四行诗(可能出自他本人之手),
  并在乐谱上逐句标注:「鸟儿的歌唱」「雷雨」「醉酒的农夫」「冰上行走」——
  用音乐讲故事,他比贝多芬早了八十年。
why_classic: |
  它可能是世上被演奏最多的古典音乐:从音乐厅到手机铃声,《春》的第一句无人不晓。
  但它的真正价值在《夏》与《冬》:《夏》的暴风雨乐章是巴洛克最狂野的页码,
  《冬》的慢乐章像炉火旁的眺望。每人心里都有一版自己的《四季》——
  挑选你的版本,本身就是入门古典音乐的最好练习。
