title: g小调第四十交响曲
title_en: "Symphony No. 40 in G minor, K. 550"
composer: wolfgang-amadeus-mozart
genre: 交响曲
catalog_no: K. 550
composed_year: "1788"
movements:
  - title: 很快的快板
    note: g 小调;不安的搏动主题,罕见的焦虑开篇
  - title: 行板
  - title: 小步舞曲:稍快板
  - title: 很快的快板
    note: 奏鸣曲式,疾驰而至终点的「火箭」音阶
background: |
  1788 年夏与第三十九、四十一交响曲在六周内接连完成。没有证据表明莫扎特生前听过它们上演——
  三部交响曲很可能是为一场未能举行的音乐会而写。
why_classic: |
  莫扎特仅有的两首小调交响曲之一,g 小调的暗色贯穿始终。它与「朱庇特」构成一暗一明的双联画:
  一个是心事的独白,一个是智慧的凯旋。两百年来,它始终是莫扎特被演奏最多的交响曲。
