title: b小调大提琴协奏曲
title_en: "Cello Concerto in B minor, Op. 104"
composer: antonin-dvorak
genre: 协奏曲
catalog_no: Op. 104 / B. 191
composed_year: "1894–1895"
movements:
  - title: 快板
    note: 大提琴以宽阔的歌唱登场
  - title: 不过分的柔板
    note: G 大调;静默中最深的告白
  - title: 终曲:适度的快板
    note: 回忆第一乐章主题的告别尾声,为大提琴与第一小提琴的二重奏
background: |
  1894–95 年旅美期间作于纽约,献给大提琴家汉纳斯·维汉。末乐章尾声是作曲家对刚刚去世的小姨子约瑟菲娜的悼念——
  引用了她最爱的《让我独处》旋律。1945 年德沃夏克的故乡解放之日,布拉格电台播放的就是这部作品。
why_classic: |
  勃拉姆斯听后感叹:「早知道大提琴协奏曲能写成这样,我自己早就写了。」它兼具交响曲的结构与协奏曲的歌唱,
  第三乐章尾声的二重奏告别,是协奏曲文献中最动人的结尾之一。
