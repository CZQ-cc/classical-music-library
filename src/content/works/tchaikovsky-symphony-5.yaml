title: e小调第五交响曲
title_en: "Symphony No. 5 in E minor, Op. 64"
composer: pyotr-ilyich-tchaikovsky
genre: 交响曲
catalog_no: Op. 64
composed_year: "1888"
movements:
  - title: 行板——有生气的快板
    note: 单簧管奏出贯穿全曲的「命运动机」
  - title: 稍自由的、如歌的行板
    note: 圆号独白,柴可夫斯基最著名的慢乐章之一
  - title: 圆舞曲:中庸的快板
    note: 舞会上带阴影的圆舞曲
  - title: 终曲:庄严的行板——活泼的快板
    note: 动机由暗转明的大调凯旋(或反讽?)
background: |
  1888 年作于克林郊外的宅邸。作曲家在草稿本上写下「引子:对命运、对天意的完全屈服」——
  但末乐章的大调结局究竟是胜利还是自我欺骗,一百多年来指挥家与听众争论不休。
why_classic: |
  与贝多芬第五一样走「由暗到明」,但柴可夫斯基的光明带着疑问。第二乐章圆号的歌唱、第三乐章病态优雅的圆舞曲,
  让它成为三部「命运交响曲」中最常被演奏的一部。
