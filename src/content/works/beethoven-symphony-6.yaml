title: F大调第六交响曲「田园」
title_en: "Symphony No. 6 in F major \"Pastoral\", Op. 68"
composer: ludwig-van-beethoven
genre: 交响曲
catalog_no: Op. 68
composed_year: "1808"
movements:
  - title: 不太快的快板——到达乡村时的愉快感受
  - title: 很有感情的行板——溪畔小景
  - title: 快板——乡民欢乐的聚会
  - title: 快板——暴风雨
  - title: 小快板——牧歌,暴风雨后的欢乐感激
background: |
  与第五交响曲几乎同时完成、同晚首演。每个乐章都带标题,是音乐史上最早的「标题交响曲」实践之一。
  贝多芬热爱在维也纳郊外散步,草稿本上写着「让听众自己体会情境」——他想要的是感受的记录,而非音画模仿。
why_classic: |
  第五与第六是一枚硬币的两面:命运的抗争与自然的安宁。第二乐章末尾夜莺、鹌鹑、布谷鸟的三重奏,
  与第四乐章暴风雨到第五乐章感恩赞的过渡,是交响曲音色叙事的教科书段落。
