title: 升c小调第五交响曲
title_en: Symphony No. 5 in C-sharp minor
composer: gustav-mahler
genre: 交响曲
catalog_no: 无编号
composed_year: "1901–1902"
movements:
  - title: 送葬进行曲:在枪林弹雨中如仪仗队般
  - title: 暴风雨般激烈地
  - title: 谐谑曲
    note: 圆号与木管的「农村婚礼」,全曲最长乐章
  - title: 小柔板
    note: 竖琴与弦乐——写给未婚妻阿尔玛的情书,电影《魂断威尼斯》使其不朽
  - title: 回旋曲-终曲
    note: 从赋格的荆棘中开出欢腾
background: |
  1901–02 年,马勒刚刚邂逅阿尔玛·辛德勒并结婚。第五交响曲没有歌词、
  没有声乐,却是一部「从黑暗走向光明」的无词传记:送葬进行曲、暴风雨、
  粗野的谐谑曲、写给爱人的柔板、最后的大团圆。第四乐章竖琴与弦乐的柔板
  在维斯康蒂电影《魂断威尼斯》中配乐后成为「马勒=死亡与美」的文化符号。
why_classic: |
  它是马勒「器乐交响曲」的顶峰:单凭乐队(没有合唱、没有歌词)完成
  从葬礼到婚礼的全部叙事。小柔板的竖琴与弦乐是二十世纪最著名的慢乐章;
  终曲的赋格从最笨拙的素材里开出胜利——马勒的答案总是这样:
  先让苦难说话,再让欢乐挣得自己的位置。
