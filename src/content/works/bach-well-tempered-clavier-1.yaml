title: 平均律键盘曲集 第一卷
title_en: The Well-Tempered Clavier, Book 1, BWV 846–869
composer: johann-sebastian-bach
genre: 前奏曲与赋格集
catalog_no: BWV 846–869
composed_year: "1722"
movements:
  - title: 24 组前奏曲与赋格,按半音阶全部 24 个大小调排列
    note: C 大调前奏曲是古诺《圣母颂》的基底;升c小调赋格五声部如大教堂
background: |
  1722 年巴赫在科腾完成第一卷,题献本扉页写着:「为受过良好教育的音乐青年之用,
  尤其为了熟练掌握两个声部;亦供已经精于此道者怡情之用。」
  「平均律」指当时新兴的调音法——让全部 24 个调都能演奏而不刺耳。
  此前每个调各有性格甚至被视为禁用;巴赫用两卷四十八曲宣告:所有调都是自由的。
why_classic: |
  它被称为音乐的「旧约圣经」(新约是贝多芬奏鸣曲):从此键盘演奏与作曲教学都以它为起点。
  每一组前奏曲+赋格都是一个微型宇宙——前奏曲自由如即兴,赋格是声部间严密的对话。
  巴赫之后三百年,肖邦、肖斯塔科维奇各自续写了他们的「二十四」。
