title: c小调第五交响曲「命运」
title_en: "Symphony No. 5 in C minor, Op. 67"
composer: ludwig-van-beethoven
genre: 交响曲
catalog_no: Op. 67
composed_year: "1804–1808"
movements:
  - title: 有活力的快板
    note: c 小调;「命运动机」四音贯穿全乐章
  - title: 稍快的行板
    note: 降A大调;双主题变奏,沉思与歌唱交替
  - title: 谐谑曲:快板
    note: c 小调;圆号呼唤引入,低音提琴赋格式涌动,直接不间断进入末乐章
  - title: 终曲:快板
    note: C 大调;加入短笛、低音大号与定音鼓的凯旋进行曲
background: |
  1804 年贝多芬开始构思,1808 年在维也纳完成——那正是他写下《海利根施塔特遗嘱》、直面耳聋之后重新站起的年代。
  首演于 1808 年 12 月 22 日维也纳河畔剧院,与第六交响曲、第四钢琴协奏曲、《合唱幻想曲》同晚上演,是一场长达四小时的音乐马拉松。
  传说中的「命运敲门声」出自秘书辛德勒的转述:贝多芬指着开头的动机说「命运就是这样敲门的」。这句话真伪难考,
  但四个音符从黑暗冲向光明的全程,确实成为音乐史上最著名的叙事。
why_classic: |
  它把一个四音动机锻造成整部交响曲的 DNA:第一乐章由它开天辟地,谐谑曲里它变形归来,末乐章它化为凯旋号角——
  「动机发展」的写作逻辑由此确立,直接影响了勃拉姆斯直至二十世纪。对普通听众,它也是最好入门的交响曲:
  结构清晰、戏剧外露、长度适中。同一部作品,卡拉扬的厚重、克莱伯的凌厉、加德纳的古乐之光,呈现出三种截然不同的贝多芬——
  比较这些录音版本,本身就是理解这部作品的最佳方式。
