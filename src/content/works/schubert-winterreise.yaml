title: 冬之旅
title_en: Winterreise, D. 911
composer: franz-schubert
genre: 声乐套曲
catalog_no: D. 911
composed_year: "1827"
movements:
  - title: 24 首歌曲,分两部(各 12 首)
    note: 「晚安」「菩提树」「春梦」「老艺人」是全曲的四个坐标
background: |
  1827 年,重病中的舒伯特读到诗人威廉·缪勒的《冬之旅》,为之着迷:
  一个被拒绝的旅人在冬夜离开城市,走过菩提树、河流与村庄,最后跟随
  街头的老艺人离去。朋友初听全曲时沉默良久,问他:「我倒想高兴高兴。」
  舒伯特答:「好的,这个我会送来——用《天鹅之歌》。」数月后他去世,年三十一。
why_classic: |
  它是音乐史上最伟大的「内心风景」:二十四首歌没有一个幸福的结尾,
  却在绝望的深处开出发芽的幽默与平静。「菩提树」的旋律温柔得像故乡,
  「老艺人」的空五度像雪原尽头的地平线。菲舍尔-迪斯考说:唱完《冬之旅》,
  你需要独自走上两小时。它是每一位艺术歌曲听众的成人礼。
