title: 马太受难曲
title_en: St Matthew Passion, BWV 244
composer: johann-sebastian-bach
genre: 受难曲(清唱剧)
catalog_no: BWV 244
composed_year: "1727"
movements:
  - title: 全曲约 68 曲,分两大部分
    note: 开场合唱「来吧,儿女们,分担主的悲恸」与终曲「我们含泪安睡」首尾呼应
background: |
  1727 年首演于莱比锡圣托马斯教堂,1729 年修订后再演——此后被遗忘近一个世纪,
  直到 1829 年门德尔松以二十岁的年龄复活了它(那正是巴赫复兴的起点)。
  双合唱团、双乐队、双管风琴的架构:福音史家以叙事宣叙贯穿,耶稣的话被光环般的光环包围,
  众赞歌像会众的回声一次次插入。
why_classic: |
  它是西方音乐对「受难」最完整的音乐沉思:个人悔罪的咏叹调(如「求你怜悯」)
  与群体合唱的巨大悲悯交替,三个小时的篇幅却没有一分钟走神。
  马太受难曲是巴赫宗教音乐的珠穆朗玛,也是每年受难周世界各地教堂与音乐厅的共同仪式。
