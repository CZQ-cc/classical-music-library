title: C大调第四十一交响曲「朱庇特」
title_en: "Symphony No. 41 in C major \"Jupiter\", K. 551"
composer: wolfgang-amadeus-mozart
genre: 交响曲
catalog_no: K. 551
composed_year: "1788"
movements:
  - title: 有活力的快板
    note: 庄严的号角与柔和的应答并置
  - title: 如歌的行板
  - title: 小步舞曲:稍快板
  - title: 很快的快板
    note: 终曲;四个主题同时进行的五声部赋格,对位技术的巅峰
background: |
  莫扎特的最后一部交响曲,1788 年 8 月 10 日完成。「朱庇特」标题为后人所加(通常归于伦敦剧院经理萨洛蒙),
  取罗马众神之王的威严。
why_classic: |
  末乐章把四个主题叠进一部五声部赋格,连巴赫都未必写得出如此灿烂的对位。它是古典交响曲「智慧与光辉」的顶点——
  在这里,复调的严密与歌剧的歌唱握手言和。
