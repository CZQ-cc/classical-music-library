title: 夜曲(二十一首)
title_en: "Nocturnes (21), Opp. 9–62"
composer: frederic-chopin
genre: 钢琴曲集
catalog_no: Op. 9 / 15 / 27 / 32 / 37 / 48 / 55 / 62
composed_year: "1827–1846"
movements:
  - title: 降E大调夜曲 Op. 9 No. 2
    note: 最著名的一首,如歌的装饰变奏
  - title: c小调夜曲 Op. 48 No. 1
    note: 戏剧性与悲剧感最深的夜曲
  - title: 降D大调夜曲 Op. 27 No. 2
    note: 李斯特最爱的夜曲之一,装饰音如涟漪
background: |
  「夜曲」体裁由爱尔兰作曲家约翰·菲尔德首创,肖邦接过它并彻底改造:右手即兴般的装饰歌唱,左手宽阔的和声波浪,
  二十一首夜曲写于 1827–1846 年,几乎贯穿他在巴黎的整个创作生涯。
why_classic: |
  夜曲是肖邦「钢琴诗人」一面的完整档案——从少年沙龙的优雅到晚期的内省暗色。Op. 9 No. 2 的旋律可能是古典音乐中
  被传唱最多的钢琴句子,而 Op. 48 No. 1 里的悲剧深度提醒人们:抒情从来不是浅薄的同义词。
