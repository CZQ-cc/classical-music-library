title: e小调第四交响曲
title_en: Symphony No. 4 in E minor, Op. 98
composer: johannes-brahms
genre: 交响曲
catalog_no: Op. 98
composed_year: "1884–1885"
movements:
  - title: 不过分的快板
    note: 开场像旋律自己「想起了自己」
  - title: 中庸的行板
    note: 圆号开场,克拉拉听后说「像从林间传来」
  - title: 快板
    note: 全乐章只用两种乐器配置,近乎野蛮
  - title: 有力的快板
    note: 终曲帕萨卡利亚——三十二年前的巴赫技法,三十个变奏
background: |
  1884–85 年间,勃拉姆斯在乡下完成他的最后一部交响曲。首演前他给友人的信里
  写着乐章间夹着「几具尸体」的玩笑——他深知这部作品走向了与时代趣味相反的方向。
  首演时观众困惑,指挥彪罗却断言:这是勃拉姆斯的《第九》(意指像贝九一样的巅峰)。
why_classic: |
  第一乐章那声开场,被布列兹称为「旋律在自己身上安睡又醒来」;
  终曲则是浪漫主义时代用巴洛克帕萨卡利亚(固定低音上的三十个变奏)
  写成的巨大挽歌——它是勃拉姆斯的「反英雄告别」,不允许任何一句自我怜悯。
  许多人心中,这是四部勃拉姆斯交响曲中最深的一部。
