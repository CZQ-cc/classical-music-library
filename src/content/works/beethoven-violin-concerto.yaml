title: D大调小提琴协奏曲
title_en: Violin Concerto in D major, Op. 61
composer: ludwig-van-beethoven
genre: 协奏曲
catalog_no: Op. 61
composed_year: "1806"
movements:
  - title: 不过分的快板
    note: 开场四声定音鼓轻敲——协奏曲史上最著名的「非开场」
  - title: 小广板
    note: 变奏曲式,加弱音器的弦乐之上小提琴的圣咏
  - title: 回旋曲
    note: 猎号般的六音主题
background: |
  1806 年 12 月为小提琴家弗朗茨·克莱门特的首演而写——排练时间极短,
  克莱门特几乎是视谱演奏,还插入了一段自己的即兴炫技(倒转琴身拉单弦)。
  首演反应冷淡,此后数十年无人问津,直到 1844 年十二岁的约阿希姆在门德尔松指挥下
  复活了它——从此它成为每位小提琴家的最高试金石。
why_classic: |
  在它之前,协奏曲是炫技场;在它之后,协奏曲是交响曲。开场四声定音鼓像钟声,
  双簧管随后唱出协奏曲文献中最安详的主题——贝多芬让「独奏」与「乐队」
  从对抗变成共同叙事。慢乐章的圣咏被称为「离天堂最近的音乐」。
  与勃拉姆斯、门德尔松、柴可夫斯基并列,它是「四大小提琴协奏曲」之首。
