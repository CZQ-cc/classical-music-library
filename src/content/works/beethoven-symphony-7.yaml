title: A大调第七交响曲
title_en: "Symphony No. 7 in A major, Op. 92"
composer: ludwig-van-beethoven
genre: 交响曲
catalog_no: Op. 92
composed_year: "1811–1812"
movements:
  - title: 稍微持续的——活泼的
  - title: 小快板
    note: a 小调;固定节奏型贯穿,葬礼与舞蹈的奇特混合
  - title: 急板
  - title: 有活力的快板
    note: 瓦格纳称之为「舞蹈的神化」
background: |
  写于 1811–12 年,1813 年首演时正逢拿破仑败退,音乐会成为维也纳的爱国庆典,第二乐章当即重演一遍。
  此时贝多芬听力已严重恶化,作品却通篇是节奏的狂欢。
why_classic: |
  瓦格纳说这是「舞蹈的神化」——整部作品建立在节奏驱动而非旋律叙事之上。第二乐章那步伐般顽固的节奏,
  从音乐厅到电影《国王的演讲》一再被借用。对指挥家而言,它是节奏控制力的试金石,也是唱片史上名盘辈出的曲目。
