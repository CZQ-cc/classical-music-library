title: 无伴奏大提琴组曲(六首)
title_en: Cello Suites Nos. 1–6, BWV 1007–1012
composer: johann-sebastian-bach
genre: 无伴奏器乐组曲
catalog_no: BWV 1007–1012
composed_year: "约 1720"
movements:
  - title: 每首六乐章:前奏曲 + 阿勒芒德/库朗特/萨拉班德/小步舞曲(或布雷)/吉格
    note: 第一组曲前奏曲是古典音乐最著名的两分钟
background: |
  约写于 1720 年科腾时期,手稿由巴赫第二任妻子安娜·玛格达莱娜抄写。
  在卡萨尔斯之前,它们被当作机械练习曲,几乎无人公开完整演奏——
  一部「消失了两个世纪的杰作」。六首组曲各有一种调性气质,
  从第一组曲 G 大调的明朗到第五组曲 c 小调的深沉,最后以第六组曲(五弦琴用)的狂欢收束。
why_classic: |
  它证明了一件独奏乐器可以自成一个宇宙:一条旋律线同时是低音、和声与歌。
  卡萨尔斯 1936–39 年的第一次全集录音,让这套「练习曲」跻身古典音乐最神圣的曲目之列;
  今天它是每一位大提琴家的试金石,也是无数人步入古典音乐的第一扇门。
