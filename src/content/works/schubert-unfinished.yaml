title: b小调第八交响曲「未完成」
title_en: "Symphony No. 8 in B minor \"Unfinished\", D. 759"
composer: franz-schubert
genre: 交响曲
catalog_no: D. 759
composed_year: "1822(未完成)"
movements:
  - title: 中庸的快板
    note: 大提琴与低音提琴在暗处的引子,是交响曲史上最著名的开篇之一
  - title: 稍快的行板
    note: E大调,歌唱到最后一小节
background: |
  1822 年,舒伯特把它题献给格拉茨音乐协会;此后手稿失踪三十七年,
  1865 年才被发现并首演——只有两个乐章,第三乐章只写了九小节草稿。
  为什么未完成?没人知道。舒伯特死前曾把它拿给友人,但从未催促完成。
why_classic: |
  两个乐章就够了:第一乐章的歌唱性开启了「舒伯特式交响曲」的所有秘密——
  圆号在雾中吹出主题,大提琴应和,旋律长得不像交响曲,像一首没有歌词的歌。
  它与「未完成」这个偶然的标题一起,成为「美因残缺而完整」的终极案例。
