title: f小调第二十三钢琴奏鸣曲「热情」
title_en: "Piano Sonata No. 23 in F minor \"Appassionata\", Op. 57"
composer: ludwig-van-beethoven
genre: 钢琴奏鸣曲
catalog_no: Op. 57
composed_year: "1804–1806"
movements:
  - title: 相当快的快板
  - title: 稍快的行板
    note: 降D大调;变奏曲,平静中的暗流
  - title: 不过分的快板——急板
    note: f 小调;不间断的终曲,赋格式轰鸣
background: |
  写于 1804–06 年,与《英雄》交响曲同期。「热情」标题由出版商克朗兹所加,贝多芬本人未用,
  但无人能否认它的贴切——这是他钢琴音乐中火山般的作品。
why_classic: |
  与「华尔斯坦」并称贝多芬中期钢琴奏鸣曲双璧。三个乐章一气呵成,戏剧浓度直追《命运》——
  据说列宁听后说:「这是了不起的音乐,简直非人所能……我每天都想听,人的创造真是不可思议。」
