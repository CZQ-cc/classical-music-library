title: A大调第二十三钢琴协奏曲
title_en: Piano Concerto No. 23 in A major, K. 488
composer: wolfgang-amadeus-mozart
genre: 协奏曲
catalog_no: K. 488
composed_year: "1786"
movements:
  - title: 快板
  - title: 柔板
    note: 升f小调——莫扎特钢协中唯一的小调慢乐章
  - title: 回旋曲:急板
background: |
  1786 年 3 月完成,正值《费加罗的婚礼》创作期——莫扎特当时是维也纳最炙手可热的
  钢琴家兼作曲家,这部协奏曲用于他自己的 subscription 音乐会。
why_classic: |
  莫扎特钢协的「黄金标准」之一:第一乐章明朗如春,第二乐章却坠入升 f 小调的深秋——
  钢琴与木管的对话像一场欲言又止的告别;末乐章回旋曲把阴云一扫而空。
  它是「莫扎特式幸福」的完整样本:明与暗从不掩饰,彼此成全。
