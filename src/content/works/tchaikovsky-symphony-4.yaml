title: f小调第四交响曲
title_en: "Symphony No. 4 in F minor, Op. 36"
composer: pyotr-ilyich-tchaikovsky
genre: 交响曲
catalog_no: Op. 36
composed_year: "1877–1878"
movements:
  - title: 连续的行板——有生气的中板
    note: 「命运」动机由圆号宣告
  - title: 小歌谣般的小行板
  - title: 谐谑曲:快板
    note: 弦乐拨弦贯穿,轻盈的嬉戏
  - title: 终曲:热情的快板
    note: 引用俄罗斯民歌《田野里的白桦》,狂欢到最后一刻
background: |
  写于 1877 年——柴可夫斯基仓促结婚、迅速崩溃、逃亡国外的那一年。他在给梅克夫人的信里逐乐章解说这部作品:
  「这就是命运,那是命定的力量……」梅克夫人正是这部作品的题献者与资助人。
why_classic: |
  第一乐章「命运」动机的宣告与末乐章民间狂欢的对抗,是柴可夫斯基交响戏剧的原型。第四、五、六三部交响曲
  构成他的「命运三部曲」——俄罗斯指挥传统在这套曲目上留下了最锋利的录音。
