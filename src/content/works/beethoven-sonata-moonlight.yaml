title: 升c小调第十四钢琴奏鸣曲「月光」
title_en: "Piano Sonata No. 14 in C-sharp minor \"Moonlight\", Op. 27 No. 2"
composer: ludwig-van-beethoven
genre: 钢琴奏鸣曲
catalog_no: Op. 27 No. 2
composed_year: "1801"
movements:
  - title: 持续的柔板
    note: 升c小调;三连音背景上的歌唱,「月光」之名由此而来
  - title: 小快板
    note: 降D大调;李斯特称之为「两个深渊之间的一朵小花」
  - title: 激动的急板
    note: 升c小调;风暴般的奏鸣曲式终曲
background: |
  1801 年作,题献给他的学生朱丽叶塔·圭恰迪妮——贝多芬一生最深的爱恋之一,因身份悬殊无果。
  「月光」标题并非作曲家所起,而是诗人雷尔施塔布在贝多芬去世后所取:如琉森湖上月夜摇桨。
why_classic: |
  它彻底颠覆了奏鸣曲「快—慢—快」的格局:把最重的终曲放在最后,让前两个乐章成为漫长的蓄力。
  末乐章的怒涛与第一乐章的静谧构成奏鸣曲史上最惊人的落差——同一部作品里,柔情与决绝都是同一个人。
