title: 练习曲 Op. 10 & Op. 25(二十四首)
title_en: Études Op. 10 & Op. 25
composer: frederic-chopin
genre: 钢琴练习曲集
catalog_no: Op. 10 / Op. 25
composed_year: "1829–1836"
movements:
  - title: 各 12 首,每首解决一个技术问题
    note: Op. 10 No. 3「离别」、No. 12「革命」、Op. 25 No. 11「冬风」是其中明星
background: |
  肖邦把「练习曲」从机械训练改造成了音乐会艺术品:每一首只攻克一个技术难题
  (三度、六度、八度、黑键、双音……),却同时是一首完整的诗。
  「革命」练习曲写于 1831 年赴巴黎途中听闻华沙陷落之日;「冬风」的右手
  被舒曼形容为「风暴中的旋风」。
why_classic: |
  波利尼 1972 年的 DG 录音把这套「钢琴家的圣经」变成了录音史上的技术奇观:
  左右手像两台独立乐器,速度推到极限而每一粒音都清可数。
  它也是「练习曲」这个词的最高荣誉证明——最功利的形式里装着最纯粹的诗歌。
