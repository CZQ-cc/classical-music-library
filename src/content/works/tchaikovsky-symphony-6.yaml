title: b小调第六交响曲「悲怆」
title_en: "Symphony No. 6 in B minor \"Pathétique\", Op. 74"
composer: pyotr-ilyich-tchaikovsky
genre: 交响曲
catalog_no: Op. 74
composed_year: "1893"
movements:
  - title: 慢板——不太快的快板
    note: 大管在深渊低语中开篇,挣扎与呼喊
  - title: 稍快的行板
    note: 5/4 拍「不对称的圆舞曲」,温柔的畸形之美
  - title: 甚快的快板
    note: 谐谑曲与进行曲的合体,常被误当作终曲而鼓掌
  - title: 终曲:哀伤的柔板
    note: 以慢板终结全曲——交响曲史上最著名的「逆行」
background: |
  1893 年 8 月完成,10 月 28 日首演,九天后柴可夫斯基猝逝,死因(霍乱或自尽)至今存疑。
  标题「悲怆」(Патетическая)由作曲家之弟莫杰斯特提议,是他在总谱上唯一认可的标题。
why_classic: |
  用慢板收尾的交响曲,此前没有人敢写。末乐章不是安慰,而是熄灭——低音提琴在黑暗中抽走最后的光。
  它是「音乐自传」的极致:无论作曲家死因如何,这部作品都成了他为自己写的安魂曲。
