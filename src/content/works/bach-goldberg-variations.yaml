title: 哥德堡变奏曲
title_en: "Goldberg Variations, BWV 988"
composer: johann-sebastian-bach
genre: 键盘变奏曲
catalog_no: BWV 988
composed_year: "1741"
movements:
  - title: 咏叹调(Aria)
    note: G 大调萨拉班德舞曲,全曲的种子与归宿
  - title: 变奏 1–30
    note: 三十段变奏,每三段一组:舞曲性变奏—双手交叉的炫技曲—卡农(自同度至九度)
  - title: 第 25 变奏(柔板)
    note: 「黑色深渊」,全曲情感最深处
  - title: 第 30 变奏:集腋曲(Quodlibet)
    note: 民歌与对位的玩笑,之后咏叹调原样归来
  - title: 咏叹调返始(Aria da capo)
    note: 「经历过一切之后的咏叹调」——同一旋律,已是不同的听者
background: |
  1741 年出版,是《键盘练习》第四卷,题献本附有巴赫亲笔。传说为失眠的凯瑟林伯爵而作、由学生哥德堡演奏——
  此说出自巴赫第一个传记作者福克尔,真伪存疑,但「哥德堡」之名流传至今。
why_classic: |
  它是复调建筑的极致:一段咏叹调的低音线生发出三十种可能——舞曲、卡农、赋格、民歌拼贴——最后回到起点。
  1955 年古尔德的录音让它从琴房走进千家万户;1981 年他重录一遍作为告别。两次录音之间的二十六年,
  是一个人与一部作品互相完成的传奇,也是古典唱片史上被讨论最多的对照。
