title: 降E大调第五钢琴协奏曲「皇帝」
title_en: "Piano Concerto No. 5 in E-flat major \"Emperor\", Op. 73"
composer: ludwig-van-beethoven
genre: 协奏曲
catalog_no: Op. 73
composed_year: "1809"
movements:
  - title: 快板
    note: 开头钢琴的华彩打断乐队——协奏曲开场的新发明
  - title: 稍快的柔板
    note: 宗教般的慢乐章,弦乐拨弦上钢琴的即兴般沉思
  - title: 回旋曲:快板
    note: 不间断进入终曲,定音鼓与钢琴的猎歌
background: |
  1809 年 5 月,拿破仑的炮火轰击维也纳,贝多芬躲在地下室用枕头捂住耳朵保护
  仅存的听力——「皇帝」就写在这座被围困的城市里。「皇帝」的标题并非贝多芬所起
  (他讨厌拿破仑的帝制),但无人能否认它的贴切:全曲有着至高无上的威严。
  首演(1811,莱比锡)时他已无法再以钢琴家身份登台。
why_classic: |
  开场即革命:钢琴先奏华彩,乐队才缓缓进入——独奏家不再是陪衬,是开场词。
  慢乐章的拨弦上,钢琴像在即兴默祷,然后小七度的转调直接滑进终曲的猎歌。
  它与《第五交响曲》同期,是「通过斗争获得胜利」这一贝多芬命题的钢琴版总结。
