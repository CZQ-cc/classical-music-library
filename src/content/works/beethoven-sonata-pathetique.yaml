title: c小调第八钢琴奏鸣曲「悲怆」
title_en: "Piano Sonata No. 8 in C minor \"Pathétique\", Op. 13"
composer: ludwig-van-beethoven
genre: 钢琴奏鸣曲
catalog_no: Op. 13
composed_year: "1798"
movements:
  - title: 庄重的——极快的快板
  - title: 如歌的柔板
    note: 降A大调,最受欢迎的慢乐章之一
  - title: 回旋曲:快板
background: |
  1798 年作,是贝多芬亲自认可并授予标题的极少数作品之一——「悲怆」(Grande Sonate pathétique)。
  出版时他二十八岁,正在维也纳以钢琴家身份征服听众。
why_classic: |
  慢乐章的旋律几乎人人能哼;第一乐章 Grave 引子的重击与快板主题的奔涌,则宣告了贝多芬式戏剧的开端。
  它是「标题性情感」第一次如此直白地进入奏鸣曲。
