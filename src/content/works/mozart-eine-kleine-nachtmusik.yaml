title: G大调弦乐小夜曲
title_en: Eine kleine Nachtmusik, K. 525
composer: wolfgang-amadeus-mozart
genre: 小夜曲
catalog_no: K. 525
composed_year: "1787"
movements:
  - title: 快板
    note: 开头四音音型可能是古典音乐最著名的「敲门声」(与贝五命运动机并称)
  - title: 浪漫曲:行板
  - title: 小步舞曲:小快板
  - title: 回旋曲:快板
background: |
  1787 年 8 月 10 日,莫扎特在作品目录里随手记下「一首小夜曲,含两个快板、一个浪漫曲、
  一个小步舞曲与终曲」——没有委托人,没有理由。生前从未出版,直到十九世纪才重见天日,
  一跃成为世上被演奏最多的古典音乐。
why_classic: |
  它是「莫扎特为什么伟大」的最小样本:四个乐章、十五分钟,没有一个多余的音。
  开头四音的上行撞击与应答,在几乎所有旋律乐器上轮转;浪漫曲的中间段突然坠入
  c 小调的阴影再从容爬出。人人都能哼,人人听不厌——这是天赋最直白的证明。
