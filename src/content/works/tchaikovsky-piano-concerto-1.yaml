title: 降b小调第一钢琴协奏曲
title_en: Piano Concerto No. 1 in B-flat minor, Op. 23
composer: pyotr-ilyich-tchaikovsky
genre: 协奏曲
catalog_no: Op. 23
composed_year: "1875"
movements:
  - title: 极庄严而从容的快板
    note: 开场铜管+钢琴和弦是古典音乐最著名的「开幕词」之一
  - title: 朴素的小行板
    note: 长笛开场,牧歌般的中乐章
  - title: 火热的快板
    note: 乌克兰民歌主题的回旋曲
background: |
  1874 年底完成,首演前他把作品弹给莫斯科音乐学院院长鲁宾斯坦听,
  鲁宾斯坦当场痛批「毫无价值,改了才能演奏」。拉赫玛尼诺夫第一交响曲式的惨败?
  恰恰相反——柴可夫斯基一个音都不改,换了独奏家在波士顿首演,大获成功。
  鲁宾斯坦后来收回成见并亲自指挥。这段「拒稿—逆袭」史是古典乐坛最著名的打脸。
why_classic: |
  开场 106 小节是古典音乐里最著名的「夸大其词」:钢琴与铜管的巨浪铺天盖地,
  然后正片才开始——此后钢琴与乐队的关系时而是决斗,时而是共舞。
  它把「炫技」与「旋律」同时推满,是每一个钢琴家职业生涯的成人礼曲目。
