title: c小调第二钢琴协奏曲
title_en: Piano Concerto No. 2 in C minor, Op. 18
composer: sergei-rachmaninoff
genre: 协奏曲
catalog_no: Op. 18
composed_year: "1901"
movements:
  - title: 中板
    note: 开头的钢琴独奏像教堂钟声,由远及近
  - title: 持续的柔板
    note: 长笛与单簧管在弦乐雾中开出全曲最著名的旋律
  - title: 小快板
    note: 终曲把旋律交给乐队后以「拉赫玛尼诺夫式」的和弦砸下
background: |
  1897 年《第一交响曲》首演惨败,拉赫玛尼诺夫抑郁到无法工作。
  心理医生尼古拉·达尔回复疗法反复对他说:「你将开始写你的协奏曲,协奏曲会写得很好。」
  1900 年他果真开始,1901 年完成——题献给达尔。此后它成为最受欢迎的
  浪漫主义协奏曲,《第二交响曲》《帕格尼尼主题狂想曲》沿同一条忧郁的路走来。
why_classic: |
  如果只能推荐一部「浪漫主义钢琴协奏曲」入门,多数人会选它:
  钟声般的开场、慢乐章里被无数电影借用的旋律、终曲的电光石火。
  它的每一个音符都在证明:直抒胸臆不是浅薄,把旋律写到极致同样需要天才。
