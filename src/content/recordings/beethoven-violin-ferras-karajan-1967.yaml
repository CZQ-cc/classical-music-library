works: [beethoven-violin-concerto]
conductor: herbert-von-karajan
orchestra: berliner-philharmoniker
soloists:
  - person: christian-ferras
    role: 小提琴
recording_year: "1967"
style_tags: [炽热高贵, 德奥框架里的浪漫, 传奇组合]
sound_notes: |
  DG 立体声黄金期的组合:卡拉扬的乐队如大教堂,费拉斯的琴声如教堂里唯一的火把——
  炽热、高贵、带着法式的颤音。
guide:
  - movement: 第一乐章:不过分的快板
    key: D大调
    sections:
      - cue: 开头
        title: 四声钟响
        key: D大调
        dynamic: p
        contour: [25, 30, 35, 40, 45, 50]
        instruments: [定音鼓, 木管, 弦乐]
        note: 定音鼓轻敲四下,双簧管随后唱出安详的主题——协奏曲以「钟声」开场,史无前例。卡拉扬把这四声敲得像黎明前的报时。
      - cue: 独奏进入
        title: 从云端降下
        key: D大调
        dynamic: p
        contour: [55, 60, 68, 62, 70, 65]
        instruments: [小提琴, 双簧管]
        note: 独奏小提琴从最高的云端一路滑翔下来接过主题——费拉斯的进入像一次没有起跳板的跳水,稳而抒情。
  - movement: 第二乐章:小广板
    key: G大调
    sections:
      - cue: 全乐章
        title: 加弱音器的圣咏
        key: G大调
        dynamic: pp
        contour: [50, 55, 48, 58, 52, 45, 40]
        instruments: [加弱音器弦乐, 小提琴]
        note: 加弱音器的弦乐铺成雾,小提琴的旋律像雾中的灯——被称为「离天堂最近的音乐」。费拉斯的弓子几乎不换弓,让句子长得像祈祷。
  - movement: 第三乐章:回旋曲
    key: D大调
    sections:
      - cue: 猎号主题
        title: 六音的猎歌
        key: D大调
        dynamic: f
        contour: [40, 55, 45, 60, 48, 58, 65]
        instruments: [小提琴, 乐队]
        note: 狩猎号角般的六音主题在每次归来时都换一套新装。费拉斯在装饰段里的即兴感,是这张唱片最「燃烧」的时刻——德奥的框架里跑着一匹法式的马。
