  - person: mstislav-rostropovich
    role: 大提琴
recording_year: "1968–69"
venue: 柏林
style_tags: [气魄宏大, 人声般的歌唱, 权威版本]
sound_notes: |
  卡拉扬的厚重音响为独唱者铺开巨大的画布,罗斯特罗波维奇的琴声像从胸腔里唱出来——
  《留声机》称两位音乐家「以完全的默契彼此应和」。这张唱片长期是德沃夏克协奏曲的首选版本。
